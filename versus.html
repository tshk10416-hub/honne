<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4a1530">
  <title>1対1で遊ぶ | HONNE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap">
  <link rel="stylesheet" href="css/common.css">
</head>
<body>
  <main id="app" class="app">

    <!-- 読み込み中 -->
    <section id="view-loading" class="screen screen-center">
      <div class="spinner" role="progressbar" aria-label="読み込み中"></div>
    </section>

    <!-- S09 1対1のモード選択（相手の個人カードをタッチしたあと） -->
    <section id="view-choose" class="screen" hidden>
      <div class="topbar">
        <a class="btn btn-ghost" href="lobby.html">← ホーム</a>
        <span class="topbar-title">1対1で遊ぶ</span>
        <span style="width:64px"></span>
      </div>

      <div class="versus card">
        <div class="versus-player" id="vs-me"></div>
        <span class="versus-vs">VS</span>
        <div class="versus-player" id="vs-opp"></div>
      </div>

      <!-- 相手から挑戦が届いている -->
      <div id="vs-invite" class="card" hidden>
        <p class="card-title" id="vs-invite-text"></p>
        <button type="button" class="btn btn-primary btn-block" id="vs-invite-accept" style="margin-top:12px">受けて立つ</button>
      </div>

      <!-- 対戦中・申し込み中のゲームがある -->
      <div id="vs-resume" class="card" hidden>
        <div class="card-row">
          <p class="card-title" id="vs-resume-text" style="flex:1"></p>
          <a class="btn btn-small" id="vs-resume-link" href="#">戻る</a>
        </div>
      </div>

      <p class="section-label" id="vs-choose-label">遊ぶモードを選んでください</p>
      <div class="choices">
        <button type="button" class="mode-card" data-mode="sniper">
          <span class="mode-card-head">
            <span class="mode-card-emoji is-spade" aria-hidden="true">♠</span>
            <span class="mode-card-title">ワード・スナイパー</span>
          </span>
          <span class="mode-card-desc">交代で質問して、相手のアンケートの答えのワードを言わせる。多く言わせたほうの勝ち。</span>
          <span class="mode-card-meta">対戦・1人90秒ずつ</span>
        </button>
        <button type="button" class="mode-card" data-mode="defuse">
          <span class="mode-card-head">
            <span class="mode-card-emoji" aria-hidden="true">♦</span>
            <span class="mode-card-title">時限爆弾解除</span>
          </span>
          <span class="mode-card-desc">お互いの答えを大急ぎで聞き出して、解除コードを入力。2人とも解除できたら成功。</span>
          <span class="mode-card-meta">協力・60秒</span>
        </button>
      </div>
    </section>

  </main>
  <script type="module" src="js/versus.js"></script>
</body>
</html>
